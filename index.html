<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dens-UI — React components in Mars Green</title>
    <meta name="description" content="Dens-UI: copy-paste React + Tailwind components with a Mars Green and Hermès orange theme. shadcn/ui-compatible registry, light and dark." />
    <meta name="theme-color" content="#008c8d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem("dens-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
